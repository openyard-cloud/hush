name: hush
# hush checks its own pull requests with the code in the pull request.
on:
  pull_request:
permissions:
  contents: read
jobs:
  comments:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - uses: ./
