name: hush
description: Flags comments added in a pull request that narrate the work ("Phase 8.1:", "(Task 7)", "the old code did X") instead of describing the code.
author: OpenYard
branding:
  icon: message-square
  color: gray-dark

inputs:
  base:
    description: Branch the pull request is compared with. Defaults to the pull request's base branch.
    default: ""
  fail:
    description: Fail the check when a narrating comment is found ("true" or "false").
    default: "true"

runs:
  using: composite
  steps:
    - name: Check the comments this pull request adds
      shell: bash
      env:
        BASE: ${{ inputs.base || github.base_ref || github.event.repository.default_branch }}
        FAIL: ${{ inputs.fail }}
        HUSH: ${{ github.action_path }}/bin/hush.mjs
      run: |
        git fetch --no-tags --quiet origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then git fetch --no-tags --quiet --unshallow origin; fi
        status=0
        node "$HUSH" check --base "origin/$BASE" --github || status=$?
        if [ "$status" -eq 1 ] && [ "$FAIL" != "true" ]; then status=0; fi
        exit "$status"
